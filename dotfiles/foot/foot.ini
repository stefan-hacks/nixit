[main]
# --- Shell & Terminal Settings ---
shell=/bin/bash # Adjust to your primary developer shell (/bin/bash, /usr/bin/fish)
term=foot
login-shell=yes

# --- Typography & Performance ---
# JetBrains Mono is standard for devs. Change to FiraCode or Hack if preferred.
font=JetBrainsMono Nerd Font:size=11:fontfeatures=calt:fontfeatures=liga
font-bold=JetBrainsMono Nerd Font:style=Bold:size=11
font-italic=JetBrainsMono Nerd Font:style=Italic:size=11
font-bold-italic=JetBrainsMono Nerd Font:style=Bold Italic:size=11
box-drawings-uses-font-glyphs=no
dpi-aware=yes

# --- Window Layout ---
initial-window-size-chars=105x28         # Standard programming split dimensions
pad=12x12                               # Cozy internal padding for easier text track
resize-delay-ms=20

[scrollback]
lines=50000                             # Generous history for heavy compiler/log monitoring
multiplier=3.0                          # Snappy mousewheel scrolling

[cursor]
style=block
blink=yes
underline-thickness=1.5px

[mouse]
hide-when-typing=yes
alternate-scroll-mode=yes

[url]
# Auto-detect URLs, IPs, and local file paths for fast hotkey clicking
launch=xdg-open ${url}
label-letters=sadfjkl;eowcmgh
osc8-underline=always

[colors]
# --- Catppuccin Mocha Official Palette ---
foreground=cdd6f4     # Text
background=1e1e2e     # Base (Dark Pastel Gray-Blue)
regular0=45475a       # Surface 1
regular1=f38ba8       # Red
regular2=a6e3a1       # Green
regular3=f9e2af       # Yellow
regular4=89b4fa       # Blue
regular5=f5c2e7       # Pink
regular6=94e2d5       # Teal
regular7=bac2de       # Subtext 1

bright0=585b70        # Surface 2
bright1=f38ba8        # Red
bright2=a6e3a1        # Green
bright3=f9e2af        # Yellow
bright4=89b4fa        # Blue
bright5=f5c2e7        # Pink
bright6=94e2d5        # Teal
bright7=a6adc8        # Subtext 0

# --- Specific UI Tweaks ---
selection-foreground=cdd6f4
selection-background=313244  # Surface 0
urls=89b4fa                  # Blue URLs
flash=585b70
flash-alpha=0.5

[cursor]
color=11111b f5e0dc   # Crust text, Rosewater cursor

# Note: Foot versions 0.26+ prefer color tables mapped under [colors-dark]
# If your elements look unstyled, duplicate the properties above into a [colors-dark] section.

[key-bindings]
# --- Developer Productivity Overrides ---
scrollback-up-page=Shift+Page_Up
scrollback-down-page=Shift+Page_Down
scrollback-up-half-page=Control+Shift+u
scrollback-down-half-page=Control+Shift+d

# Fast text-zooming during screen-shares / presentations
font-increase=Control+plus Control+equal
font-decrease=Control+minus
font-reset=Control+0

# URL Interception Mode (Type Ctrl+Shift+o, then hit the overlay letter to open link)
url-launch=Control+Shift+o

# Clipboard controls
clipboard-copy=Control+Shift+c XF86Copy
clipboard-paste=Control+Shift+v XF86Paste

# Search history output efficiently
search-start=Control+Shift+f

[search-bindings]
# Key bindings active only when searching your terminal history buffer
cancel=Escape Control+g
find-prev=Control+p
find-next=Control+n
