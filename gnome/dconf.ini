# Shell Keybindings
# ============================================================================

[org/gnome/shell/keybindings]
screen-brightness-down=['<Ctrl><Super>Down']
screen-brightness-up=['<Ctrl><Super>Up']
show-screenshot-ui=['<Alt>F9']
toggle-message-tray=['<Control>F2']
toggle-overview=['<Alt>o']
toggle-quick-settings=['<Control>F3']

[org/gnome/shell/weather]
automatic-location=false
locations=[]

[org/gnome/shell/world-clocks]
locations=[]

# ============================================================================
# Mutter / Window Manager
# ============================================================================

[org/gnome/mutter]
output-luminance=[]
overlay-key='Super'

[org/gnome/mutter/keybindings]
cancel-input-capture=['<Super><Shift>Escape']
rotate-monitor=['XF86RotateWindows']
switch-monitor=['<Super>p', 'XF86Display']
toggle-tiled-left=['<Super>Left']
toggle-tiled-right=['<Super>Right']

# ============================================================================
# Color/GTK Settings
# ============================================================================

[org/gtk/gtk4/settings/file-chooser]
date-format='regular'
location-mode='path-bar'
show-hidden=true
sort-column='name'
sort-directories-first=true
sort-order='ascending'
type-format='category'
view-type='list'

[org/gtk/settings/file-chooser]
date-format='regular'
location-mode='path-bar'
show-hidden=true
show-size-column=true
show-type-column=true
sort-column='name'
sort-order='ascending'
type-format='category'

[org/gtk/gtk4/settings/color-chooser]
custom-colors=[(0.0, 0.0, 0.0, 0.8), (0.125, 0.125, 0.125, 1.0), (0.569, 0.761, 0.875, 1.0)]
selected-color=(true, 1.0, 1.0, 1.0, 1.0)

[org/gtk/settings/color-chooser]
custom-colors=[(0.451, 0.451, 0.451, 1.0), (0.094, 0.094, 0.094, 1.0), (0.039, 0.055, 0.071, 1.0), (0.114, 0.114, 0.176, 1.0), (0.147, 0.071, 0.273, 1.0), (0.047, 0.035, 0.067, 1.0), (0.047, 0.037, 0.067, 1.0), (0.094, 0.067, 0.149, 1.0)]
selected-color=(true, 0.0, 0.0, 0.0, 1.0)

# ============================================================================
# GNOME System Monitor
# ============================================================================

[org/gnome/gnome-system-monitor]
show-dependencies=false
show-whose-processes='user'

# ============================================================================
# GNOME Tweaks
# ============================================================================

[org/gnome/tweaks]
show-extensions-notice=false

# ============================================================================
# Virt-Manager
# ============================================================================

[org/virt-manager/virt-manager]
manager-window-height=550
manager-window-width=550
system-tray=true
xmleditor-enabled=true

[org/virt-manager/virt-manager/confirm]
delete-storage=false
forcepoweroff=true

[org/virt-manager/virt-manager/connections]
autoconnect=['qemu:///system']
uris=['qemu:///system']

[org/virt-manager/virt-manager/details]
show-toolbar=true

[org/virt-manager/virt-manager/new-vm]
graphics-type='system'

[org/virt-manager/virt-manager/vmlist-fields]
disk-usage=false
network-traffic=false

# ============================================================================
# End of Sanitized GNOME Settings
# ============================================================================
